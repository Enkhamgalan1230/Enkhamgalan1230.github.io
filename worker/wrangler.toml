name = "enkhamgalan-spotify-api"
main = "src/index.ts"
compatibility_date = "2026-09-02"

[vars]
ALLOWED_ORIGIN = "https://enkhamgalan1230.github.io,https://entwan.dev,https://www.entwan.dev,http://localhost:4321,http://127.0.0.1:4321"
SPOTIFY_REDIRECT_URI = "https://enkhamgalan-spotify-api.zaecisama.workers.dev/oauth/callback"

[[vectorize]]
binding = "VECTORIZE"
index_name = "entwan-knowledge"

[ai]
binding = "AI"

[[ratelimits]]
name = "KUMO_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

[[d1_databases]]
binding = "GUESTBOOK_DB"
database_name = "entwan-guestbook"
database_id = "31b96e4d-4bbe-4afc-9a82-d25178a0a335"
